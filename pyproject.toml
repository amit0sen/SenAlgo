[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senalgo"
version = "2.0.0"
description = "SenAlgo — Self-improving AI Trading Agent by Amit Kumar Sen"
authors = [{name = "Amit Kumar Sen", email = "akperson44@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

keywords = [
    "trading", "AI", "SMC", "Elliott Wave", "ICT", "order flow",
    "volume profile", "backtesting", "Pine Script", "algorithmic trading",
    "quantitative finance", "NSE", "BSE", "crypto",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # LLM providers (OpenAI SDK works for ALL OpenAI-compat providers)
    "openai>=1.30",
    "anthropic>=0.30",

    # Web framework & API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Market data (ALL FREE — no API keys)
    "yfinance>=0.2.40",
    "ccxt>=4.3",
    "akshare>=1.14",

    # Technical analysis
    "smartmoneyconcepts>=0.0.18",
    "pandas-ta==0.4.71b0",
    "ta>=0.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",

    # Broker connectors
    "kiteconnect>=5.0",       # Zerodha
    "fyers-apiv3>=3.1",       # Fyers (+ live data)
    "dhanhq>=2.0",            # Dhan
    "alpaca-py>=0.21",        # Alpaca
    "ib_insync>=0.9.86",      # IBKR
    "tigeropen>=3.1",         # Tiger Brokers
    # dhanhq, NorenRestApiPy, ccxt cover Dhan/Shoonya/Crypto

    # Data storage & utilities
    "duckdb>=0.10",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "websockets>=12",
    "duckduckgo_search>=6.1",
    "pyotp>=2.9",              # TOTP for Shoonya
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
senalgo        = "cli.main:main"
senalgo-server = "api_server:start"
senalgo-init   = "cli.main:run_init"

[tool.setuptools.packages.find]
where = ["agent"]
include = ["src*", "cli*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
